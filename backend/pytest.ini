[pytest]
# 测试发现规则
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 异步测试模式（pytest-asyncio）
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 输出
addopts = -ra --strict-markers --durations=5
filterwarnings =
    ignore::DeprecationWarning
