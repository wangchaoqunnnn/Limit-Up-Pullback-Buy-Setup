# =============================================================================
# 涨停回调低吸战法 —— Docker Compose 编排
# 全部参数通过同目录 .env 注入（模板见 .env.example），
# 不含任何绝对路径与硬编码主机地址。
# 一键部署：./deploy.sh   或   pwsh -File .\deploy.ps1
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 构建期镜像源：默认**全程使用国内镜像**（实测国内服务器直连
        # files.pythonhosted.org 只有 18 KB/s，pandas 会读超时导致构建失败）。
        #   主源   清华 TUNA
        #   备用源 中科大 USTC（同为国内镜像，互为容灾）
        # 海外服务器可在 .env 中改为官方源：
        #   PIP_INDEX_URL=https://pypi.org/simple
        #   PIP_EXTRA_INDEX_URL=
        #   NPM_REGISTRY=https://registry.npmjs.org
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
        PIP_EXTRA_INDEX_URL: "${PIP_EXTRA_INDEX_URL:-https://pypi.mirrors.ustc.edu.cn/simple}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
    image: ${IMAGE_NAME:-limit-up-pullback}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-limit-up-app}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "${APP_PORT:-8000}"
      # 真实行情模式：auto=按 DATA_SOURCE_ORDER 依次尝试真实源，全失败才降级演示数据
      #               real=绝不降级（生产推荐）；也可强制单源 eastmoney/tencent/ths/sina/yahoo
      DATA_SOURCE_MODE: "${DATA_SOURCE_MODE:-auto}"
      # 末位 yahoo（雅虎财经）为独立境外兜底源，不提供北交所与全市场列表
      DATA_SOURCE_ORDER: "${DATA_SOURCE_ORDER:-eastmoney,tencent,ths,sina,yahoo}"
      DATA_DIR: "./data"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-300}"
      # 股票池覆盖范围：0 = 不限量、覆盖全部 A 股（主板/创业板/科创板/北交所，约 5500 只）
      UNIVERSE_SIZE: "${UNIVERSE_SIZE:-0}"
      # 合成演示数据规模（与真实股票池独立）
      SYNTHETIC_UNIVERSE_SIZE: "${SYNTHETIC_UNIVERSE_SIZE:-300}"
      # 开盘期间刷新间隔（秒）：后端缓存 TTL 与前端轮询间隔都取此值
      REFRESH_INTERVAL_SECONDS: "${REFRESH_INTERVAL_SECONDS:-30}"
      # 日线增量缓存每只保留的最大根数与并发数
      KLINE_CACHE_MAX_DAYS: "${KLINE_CACHE_MAX_DAYS:-400}"
      # 进程内日线读穿缓存：全市场从 SQLite 重建一次实测 43.94 秒，
      # 有了它后续请求直接命中内存（不改变 30 秒刷新的新鲜度语义）。
      # 全市场约占 150MB；内存紧张的机器可设为 0。
      KLINE_MEMORY_CACHE_SECONDS: "${KLINE_MEMORY_CACHE_SECONDS:-900}"
      KLINE_MEMORY_CACHE_MAX_CODES: "${KLINE_MEMORY_CACHE_MAX_CODES:-8000}"
      # 启动后台预热全市场日线（一次性约 3 分钟，期间接口照常可用）
      WARMUP_ON_STARTUP: "${WARMUP_ON_STARTUP:-true}"
      WARMUP_WAIT_MIN_CODES: "${WARMUP_WAIT_MIN_CODES:-500}"
      SOURCE_CONCURRENCY: "${SOURCE_CONCURRENCY:-12}"
      KLINE_CONCURRENCY: "${KLINE_CONCURRENCY:-24}"
      # 上游接口超时（秒）。东方财富在受限网络下会被快速失败并由其他源接管
      HTTP_TIMEOUT: "${HTTP_TIMEOUT:-10}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      TZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "${HOST_PORT:-8000}:${APP_PORT:-8000}"
    volumes:
      # 持久化缓存 / 策略参数 / 低吸池，容器重建不丢数据
      - app-data:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${APP_PORT}/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-net

  # ---------------------------------------------------------------------------
  # 可选：Caddy 反向代理 + 自动 HTTPS
  # 仅当 DOMAIN 非空时启用：docker compose --profile https up -d
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: ${CONTAINER_NAME:-limit-up-app}-caddy
    restart: unless-stopped
    profiles:
      - https
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: "${DOMAIN:-}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
      APP_PORT: "${APP_PORT:-8000}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app-net

volumes:
  app-data:
  caddy-data:
  caddy-config:

networks:
  app-net:
    driver: bridge
